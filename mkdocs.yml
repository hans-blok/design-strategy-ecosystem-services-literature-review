# ============================================================
# MkDocs configuration
# Only the contents of docs/ are published. Files in the
# repository root (README.md, startup.md, ...) are NOT part of
# the site — add a page to docs/ and to the nav below instead.
# ============================================================

# ------------------------------------------------------------
# 1. Site identity
# ------------------------------------------------------------
site_name: "Design Strategy & Ecosystem Services — Literature Review"
site_description: "Structured extraction workflow for a literature review of ~120 scientific papers"
site_author: "hans-blok"
site_url: "https://hans-blok.github.io/design-strategy-ecosystem-services-literature-review/"

# ------------------------------------------------------------
# 2. Documentation source
# ------------------------------------------------------------
docs_dir: "docs"
site_dir: "site"

# ------------------------------------------------------------
# 3. Theme
# ------------------------------------------------------------
theme:
  name: "material"
  language: "en"
  features:
    - navigation.instant
    - navigation.sections
    - navigation.top
    - content.code.copy
    - search.suggest
    - search.highlight
    - toc.integrate
  # Kleuren komen uit docs/stylesheets/literature-review.css, niet uit een
  # Material-palet. Daarom staan hier alleen de licht/donker-schema's.
  palette:
    - scheme: default
      toggle:
        icon: material/weather-night
        name: Switch to dark mode
    - scheme: slate
      toggle:
        icon: material/weather-sunny
        name: Switch to light mode

# ------------------------------------------------------------
# 3b. Eigen stijl
# Elk stylesheet dat de site moet gebruiken, staat hier. Een .css-bestand
# in docs/stylesheets/ dat niet in deze lijst staat, wordt wel meegekopieerd
# maar nooit ingeladen.
# ------------------------------------------------------------
extra_css:
  - stylesheets/literature-review.css

# ------------------------------------------------------------
# 4. Plugins
# ------------------------------------------------------------
plugins:
  - search:
      lang: en

# ------------------------------------------------------------
# 5. Markdown extensions
# ------------------------------------------------------------
markdown_extensions:
  - admonition
  - attr_list
  - def_list
  - footnotes
  - md_in_html
  - tables
  - toc:
      permalink: true
      toc_depth: 3
  - pymdownx.betterem:
      smart_enable: all
  - pymdownx.details
  - pymdownx.highlight:
      anchor_linenums: true
      line_spans: __span
      pygments_lang_class: true
  - pymdownx.inlinehilite
  - pymdownx.superfences
  - pymdownx.tabbed:
      alternate_style: true
  - pymdownx.tasklist:
      custom_checkbox: true

# ------------------------------------------------------------
# 6. Navigation
# Every published page is listed here. A .md file in docs/ that
# is not listed still gets built; keep this list complete so the
# site structure stays deliberate.
# ------------------------------------------------------------
nav:
  - Home: index.md
  - Startup: startup.md

# ------------------------------------------------------------
# 7. Extra
# ------------------------------------------------------------
extra:
  generator: false

copyright: "Copyright &copy; 2026"
